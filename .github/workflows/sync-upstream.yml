name: Sync upstream

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-upstream-main
  cancel-in-progress: false

jobs:
  open-sync-pr:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      SYNC_BRANCH: automation/upstream-sync
      UPSTREAM_URL: https://github.com/kyutai-labs/pocket-tts.git
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch upstream main
        run: |
          git remote add upstream "$UPSTREAM_URL"
          git fetch --no-tags upstream main
          git fetch --no-tags origin main

      - name: Check for an existing sync
        id: sync-state
        run: |
          if git merge-base --is-ancestor upstream/main origin/main; then
            echo "needed=false" >> "$GITHUB_OUTPUT"
            echo "Upstream main is already contained in this fork."
            exit 0
          fi

          existing_pr=$(gh pr list \
            --repo "$GITHUB_REPOSITORY" \
            --state open \
            --base main \
            --head "$SYNC_BRANCH" \
            --json number \
            --jq '.[0].number // empty')
          if [ -n "$existing_pr" ]; then
            echo "needed=false" >> "$GITHUB_OUTPUT"
            echo "Sync PR #$existing_pr is already open; leaving its branch untouched."
            exit 0
          fi

          echo "needed=true" >> "$GITHUB_OUTPUT"

      - name: Publish the upstream tip to the sync branch
        if: steps.sync-state.outputs.needed == 'true'
        run: git push --force origin upstream/main:"refs/heads/$SYNC_BRANCH"

      - name: Open upstream sync pull request
        if: steps.sync-state.outputs.needed == 'true'
        run: |
          upstream_sha=$(git rev-parse upstream/main)
          gh pr create \
            --repo "$GITHUB_REPOSITORY" \
            --base main \
            --head "$SYNC_BRANCH" \
            --title "Sync upstream main" \
            --body "Merge upstream kyutai-labs/pocket-tts at ${upstream_sha} into this fork.

          This branch points at the exact upstream commit. Resolve any conflicts in this PR and
          merge it with a **merge commit**. Do not squash or rebase: preserving upstream ancestry
          prevents already-synchronized commits from appearing in future sync PRs.

          Created by the weekly upstream synchronization workflow."
